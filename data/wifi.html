<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <title>Wi-Fi · Gaggia Guru</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="wifi">
  <header class="bar">
    <a class="back" href="/" aria-label="Back to dashboard">‹</a>
    <h1>Wi-Fi</h1>
    <span id="conn" class="pill off">offline</span>
  </header>

  <main>
    <section class="card">
      <h2>Current connection</h2>
      <dl id="wifiInfo" class="kv"></dl>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>Nearby networks</h2>
        <button type="button" id="scanBtn" class="ghost small">Scan</button>
      </div>
      <ul id="networks" class="list"><li class="muted">Scanning…</li></ul>
    </section>

    <section class="card">
      <h2>Connect</h2>
      <form id="wifiForm">
        <input id="ssidIn" name="ssid" placeholder="Network name (SSID)" required maxlength="32"
               autocomplete="off" autocapitalize="none" spellcheck="false">
        <input id="passIn" name="pass" type="password" placeholder="Password" maxlength="64"
               autocomplete="current-password">
        <label class="check"><input type="checkbox" id="showPass"> Show password</label>
        <button type="submit" class="primary">Save &amp; reboot</button>
      </form>
    </section>

    <section class="card">
      <h2>Saved network</h2>
      <p class="muted">Forgetting the saved network reboots the device into setup-hotspot mode.</p>
      <button id="forgetBtn" class="danger">Forget Wi-Fi</button>
    </section>
  </main>

  <div id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
