<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <title>Gaggia Guru</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="home">
  <header class="bar">
    <h1>Gaggia Guru</h1>
    <span id="conn" class="pill off">offline</span>
  </header>

  <main>
    <p class="sub"><span id="hostname">gaggia-guru</span> · <span id="ipaddr">–</span></p>

    <section class="card machine">
      <div class="card-head">
        <h2>Machine</h2>
        <span id="mState" class="state">–</span>
      </div>
      <p id="mAlert" class="alert" hidden></p>
      <div class="gauges">
        <div class="gauge"><small>Boiler</small><b id="mTemp">–</b><span id="mSet">&nbsp;</span></div>
        <div class="gauge"><small>Pressure</small><b id="mPress">–</b><span id="mPressT">&nbsp;</span></div>
        <div class="gauge"><small>Shot</small><b id="mShot">–</b><span>seconds</span></div>
      </div>
      <canvas id="mGraph" class="graph" aria-label="Boiler temperature and brew pressure over time"></canvas>
      <div class="legend">
        <span><i class="sw temp"></i>Boiler °C</span>
        <span><i class="sw temp dash"></i>Target °C</span>
        <span><i class="sw press"></i>Pressure bar</span>
        <span><i class="sw press dash"></i>Target bar</span>
      </div>
      <dl id="mInfo" class="kv"></dl>
    </section>

    <nav class="tiles">
      <a class="tile" href="settings.html">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
        <span>Settings</span>
        <small id="setSub">Temperatures, pressure &amp; tuning</small>
      </a>
      <a class="tile" href="wifi.html">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 8.5a15 15 0 0 1 20 0M5 12a10 10 0 0 1 14 0M8.5 15.5a5 5 0 0 1 7 0"/><circle cx="12" cy="19" r="1.3"/></svg>
        <span>Wi-Fi</span>
        <small id="wifiSub">Network settings</small>
      </a>
      <a class="tile" href="update.html">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg>
        <span>Update</span>
        <small id="fwSub">Firmware &amp; files</small>
      </a>
      <a class="tile" href="io.html">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></svg>
        <span>IO Status</span>
        <small id="ioSub">Pin names &amp; states</small>
      </a>
    </nav>

    <section class="card">
      <h2>Device status</h2>
      <dl id="info" class="kv"></dl>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
