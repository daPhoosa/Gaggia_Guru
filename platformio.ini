; PlatformIO project configuration for ESP32-WROOM-32U
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-serial

; ---------------------------------------------------------------------------
; Shared settings
; ---------------------------------------------------------------------------
[env]
platform = espressif32@6.9.0
board = esp32dev                     ; ESP32-WROOM-32U = ESP32-D0WD + 4MB flash, external antenna (u.FL)
framework = arduino
board_build.flash_size = 4MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
extra_scripts = pre:scripts/gen_io_pins.py   ; builds IO table from include/io_pins.h
lib_deps =
    ESP32Async/AsyncTCP@3.3.2
    ESP32Async/ESPAsyncWebServer@3.6.0
    bblanchon/ArduinoJson@7.2.1
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DFW_VERSION=\"1.0.0\"

; ---------------------------------------------------------------------------
; Upload over USB serial (first flash, or recovery)
;   pio run -e esp32-serial -t upload
;   pio run -e esp32-serial -t uploadfs
; ---------------------------------------------------------------------------
[env:esp32-serial]
upload_speed = 921600

; ---------------------------------------------------------------------------
; Upload over Wi-Fi with ArduinoOTA (espota)
;   pio run -e esp32-ota -t upload
;   pio run -e esp32-ota -t uploadfs
; Change upload_port to the device IP if mDNS doesn't resolve on your network.
; The --auth value must match OTA_PASSWORD in include/config.h.
; The ESP32 connects BACK to this PC on a TCP host port (3233-3240, chosen per
; upload by scripts/espota_port.py) to fetch the image, so the PC firewall must
; allow that range, e.g.:
;   sudo ufw allow from 192.168.1.0/24 to any port 3233:3240 proto tcp
; ---------------------------------------------------------------------------
[env:esp32-ota]
upload_protocol = espota
upload_port = gaggia-savant.local
upload_flags =
    --port=3232
    --auth=changeme-ota
; Note: an env-level extra_scripts replaces the [env] one, so list both.
extra_scripts =
    pre:scripts/gen_io_pins.py
    post:scripts/espota_port.py
